name: Release

# Tag a commit and push the tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# This builds the same three artifacts CI builds, publishes the container to
# GHCR and attaches the two archives to a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist)"
        required: true

permissions:
  contents: write # create the release
  packages: write # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest

    # The end-to-end suite needs a database and a running server. CI keeps to
    # `nix build` and a curl-level smoke test on every commit; paying for a real
    # browser run is worth it here, where the result is published.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: goodie
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: goodie
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goodie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          # A release run reuses CI's cache but does not prune it.
          purge: false

      # `nix build .#default` runs the unit tests, so a release cannot be cut
      # from a commit whose tests fail.
      - name: Build and test (native)
        run: nix build .#default --print-build-logs

      - name: Build release artifacts
        run: |
          nix build --print-build-logs --out-link result-container .#container
          nix build --print-build-logs --out-link result-linux    .#linux-archive
          nix build --print-build-logs --out-link result-windows  .#windows-archive
          mkdir -p dist
          cp -L result-linux/*.tar.gz dist/
          cp -L result-windows/*.zip  dist/
          ls -lh dist

      # Against the container, not a local build: what gets tested is what gets
      # published. Host networking so it reaches the Postgres service, which
      # GitHub publishes on the runner's own localhost.
      - name: Start the container against Postgres
        run: |
          set -euo pipefail
          image=$(docker load -i result-container | sed -n 's/^Loaded image: //p')
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "loaded $image"

          docker run -d --name goodie --network host \
            -e DATABASE_URL='postgres://goodie:secret@127.0.0.1:5432/goodie' \
            -e LEPTOS_SITE_ADDR='0.0.0.0:3000' \
            "$image"

          # The server migrates and seeds on first boot, so give it room.
          curl -sf --retry 60 --retry-delay 2 --retry-connrefused \
            -o /dev/null http://127.0.0.1:3000/

      # The runner and the browsers both come from the flake, so this is the
      # same command a developer runs in `nix develop`.
      #
      # Chromium only. nixpkgs' webkit launches on NixOS but not on a stock
      # ubuntu runner — it dlopens host graphics and GStreamer libraries the
      # closure does not carry off NixOS, and every test dies in
      # `browserContext.newPage` before it navigates anywhere. Locally all three
      # engines work, and `playwright test` still runs the full set. For "does
      # the page render" a second engine adds little; it cost 15 minutes of
      # timeouts here.
      - name: End-to-end tests
        run: nix develop --command bash -c 'cd end2end && playwright test --project=chromium'

      # A release-only suite is painful to debug from log scrollback.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: end2end/playwright-report
          if-no-files-found: ignore

      - name: Server log
        if: always()
        run: docker logs goodie || true

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Push the container to GHCR
        run: |
          set -euo pipefail
          # $IMAGE was loaded and exported by the end-to-end step above.
          echo "publishing $IMAGE"

          # ghcr.io wants a lowercase owner; repository names already are.
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          tag='${{ github.event.inputs.tag || github.ref_name }}'

          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

          for t in "$tag" "${tag#v}" latest; do
            docker tag "$IMAGE" "$repo:$t"
            docker push "$repo:$t"
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          notes=$(cat <<EOF
          ## Artifacts

          | | |
          | --- | --- |
          | Linux (x86_64) | \`*-x86_64-linux.tar.gz\` — statically linked, runs on any glibc or musl distro |
          | Windows (x86_64) | \`*-x86_64-windows.zip\` — no runtime to install |
          | Container | \`docker pull $repo:$tag\` |

          Every archive holds the server binary with its \`site/\` directory beside
          it and a launcher script. All of them need \`DATABASE_URL\` pointing at a
          Postgres instance; the server runs its own migrations on startup.

          See the README for the full run instructions.
          EOF
          )

          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes "$notes" \
            --verify-tag
